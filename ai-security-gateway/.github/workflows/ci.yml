name: CI Security Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-sast:
    name: Lint + SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Ruff (lint)
        run: ruff check src/ tests/
      - name: Bandit (SAST)
        run: bandit -r src/ -f txt

  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-and-attack-suite:
    name: Unit tests + attack simulation suite
    runs-on: ubuntu-latest
    needs: [lint-and-sast]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run pytest (includes OWASP-mapped attack suite)
        run: pytest tests/ -v --junitxml=test-results.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml

  dependency-scan:
    name: Dependency / SCA scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit dependencies
        run: pip install -e . && pip-audit || true

  security-gate:
    name: Security gate (pass/fail summary)
    runs-on: ubuntu-latest
    needs: [lint-and-sast, secret-scan, test-and-attack-suite, dependency-scan]
    steps:
      - name: All security gates passed
        run: echo "Lint, SAST, secret scan, attack suite, and SCA all passed. Safe to deploy."
